version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incubrix_broll_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/app/storage_root
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=incubrix-videos
      - DEFAULT_TTS_PROVIDER=edge_tts
      - DEFAULT_VOICE=en-IN-female
      - MAX_CONCURRENT_JOBS=4
    volumes:
      - engine_storage:/app/storage_root
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: incubrix_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  engine_storage:
  minio_data:
